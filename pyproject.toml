[project]
name = "esci-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.14",
    "matplotlib>=3.11.2",
    "nltk>=3.10.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pystemmer>=3.1.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.66.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
